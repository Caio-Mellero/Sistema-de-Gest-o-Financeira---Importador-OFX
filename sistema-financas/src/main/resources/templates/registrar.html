<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta — Minhas Finanças</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            background-color: #09090b;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .auth-card {
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 450px;
        }

        .auth-logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .auth-subtitle {
            color: #71717a;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .form-control {
            background-color: #09090b;
            border: 1px solid #27272a;
            color: #e4e4e7;
            padding: 0.65rem 1rem 0.65rem 2.75rem;
            border-radius: 8px;
        }

        .form-control:focus {
            background-color: #09090b;
            border-color: #6366f1;
            color: #e4e4e7;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .form-control::placeholder {
            color: #52525b;
        }

        .form-label {
            color: #a1a1aa;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.4rem;
        }

        .btn-primary-auth {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            color: #fff;
            font-weight: 600;
            padding: 0.75rem;
            border-radius: 8px;
            width: 100%;
            font-size: 1rem;
            transition: opacity 0.2s;
        }

        .btn-primary-auth:hover {
            opacity: 0.9;
            color: #fff;
        }

        .auth-link {
            color: #818cf8;
            text-decoration: none;
            font-weight: 500;
        }

        .auth-link:hover {
            color: #a5b4fc;
        }

        .alert-auth {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
        }

        .input-group-icon {
            position: relative;
        }

        .input-group-icon .bi {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #52525b;
            font-size: 1rem;
            z-index: 2;
        }

        .password-hint {
            font-size: 0.78rem;
            color: #52525b;
            margin-top: 0.3rem;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: #3f3f46;
            font-size: 0.8rem;
            margin: 1.5rem 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #27272a;
        }
    </style>
</head>

<body>

    <div class="auth-card shadow-lg">
        <div class="auth-logo">
            <i class="bi bi-wallet-fill" style="color: #818cf8;"></i>
            Minhas Finanças
        </div>
        <p class="auth-subtitle">Crie sua conta gratuita e comece a controlar suas finanças</p>

        <!-- Mensagem de erro -->
        <div th:if="${erro}" class="alert-auth">
            <i class="bi bi-exclamation-circle me-2"></i>
            <span th:text="${erro}"></span>
        </div>

        <form th:action="@{/registrar}" method="post">
            <div class="mb-3">
                <label class="form-label">Seu nome</label>
                <div class="input-group-icon">
                    <i class="bi bi-person"></i>
                    <input type="text" id="nome" name="nome" class="form-control" placeholder="João Silva" required
                        autocomplete="name">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <div class="input-group-icon">
                    <i class="bi bi-envelope"></i>
                    <input type="email" id="email" name="email" class="form-control" placeholder="seu@email.com"
                        required autocomplete="email">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Senha</label>
                <div class="input-group-icon">
                    <i class="bi bi-lock"></i>
                    <input type="password" id="senha" name="senha" class="form-control" placeholder="••••••••" required
                        autocomplete="new-password">
                </div>
                <p class="password-hint">Mínimo de 6 caracteres.</p>
            </div>

            <div class="mb-4">
                <label class="form-label">Confirmar senha</label>
                <div class="input-group-icon">
                    <i class="bi bi-lock-fill"></i>
                    <input type="password" id="confirmarSenha" name="confirmarSenha" class="form-control"
                        placeholder="••••••••" required autocomplete="new-password">
                </div>
            </div>

            <button type="submit" class="btn-primary-auth">
                <i class="bi bi-person-plus me-2"></i>
                Criar Conta
            </button>
        </form>

        <div class="divider">ou</div>

        <p class="text-center m-0" style="color: #71717a; font-size: 0.875rem;">
            Já tem uma conta?
            <a href="/login" class="auth-link">Entrar agora</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
